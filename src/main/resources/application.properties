spring.application.name=OnAirMarket

# ---------- DB (MySQL) ----------
# 스키마(onairmarket)가 없으면 자동 생성, 테이블은 JPA 엔티티로 자동 생성(SQL 파일 불필요)
spring.datasource.url=jdbc:mysql://localhost:3306/onairmarket?createDatabaseIfNotExist=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database=mysql
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------- 파일 업로드 (영상 50MB, 사진 8MB : 서비스에서 종류별로 다시 검사) ----------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=60MB
server.tomcat.max-swallow-size=-1
# 경매 등록 폼은 입력 칸이 13개(파일 2개 포함)라 Tomcat 기본 최대 파트 수(10)를 넘는다 → 여유 있게 늘림
server.tomcat.max-part-count=50
onair.upload-dir=./uploads

spring.messages.encoding=UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
